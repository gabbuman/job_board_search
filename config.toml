# job-watcher configuration
# Order of [[companies]] = priority order in the email (top = shown first).
# Find a new company's board:  python3 discover.py "Company Name" [slug ...]

[email]
to = "mall.shubhkumar@gmail.com"     # overridden by the ALERT_TO env/secret if set

[settings]
baseline_recent_hours = 24     # on first sight of a board, still alert jobs the ATS says were published in the last N h
flap_grace_hours      = 72     # a job that vanishes and returns within this window is restored silently
gone_ttl_days         = 45     # how long closed IDs are remembered (reopen/repost detection)
repost_window_days    = 30     # new ID + same title/location as a job seen in this window -> tagged "reposted"
notify_reposts        = true
fail_warn_after_runs  = 6      # email a warning when a board fails this many runs in a row (6 x 30 min = 3 h)
workday_country       = "Canada"  # Workday/Jibe boards are filtered server-side to this country ("" = whole board)
max_workers           = 12
fetch_budget_seconds  = 300

[filters]
# Title must match one include pattern and no exclude pattern (case-insensitive regex).
title_include = [
  'engineer', 'engineering', 'developer', 'software', 'programmer', '\bdata\b', 'analytics', 'platform',
  'infrastructure', 'devops', '\bsre\b', 'reliability', '\bcloud\b', 'back[- ]?end', 'full[- ]?stack',
  'firmware', 'embedded', 'integration', 'automation', '\btest', '\bqa\b', 'validation', 'verification',
  'solutions? (architect|engineer)', 'forward deployed', 'machine learning', '\bml\b', '\bai\b', 'python',
  '\bsystems?\b', '\biot\b', 'controls?', 'technical staff', 'technologist', 'tooling',
  'ing[ée]nieur', 'd[ée]veloppeu', 'logiciel', 'donn[ée]es',
]
title_exclude = [
  '\bintern(ship)?\b', 'co-?op\b', '\bstudent\b', '\bprincipal\b', '\bdirector\b', 'vice president', '\bvp\b',
  'head of', '\bchief\b', '\bmanager\b', '\bsales\b', 'account executive', 'recruit', 'marketing', 'counsel',
  'legal', 'payroll', 'accountant', 'annotation', 'apprentice', 'technician', 'stagiaire',
]
# A job passes if any location/country mentions Canada (or a target place)...
location_include = [
  'canada', 'canadian', 'british columbia', 'vancouver', 'burnaby', 'richmond, bc', 'surrey', 'coquitlam',
  'new westminster', 'north vancouver', 'victoria, bc', 'kelowna', 'toronto', 'ontario', 'ottawa', 'waterloo',
  'kitchener', 'markham', 'mississauga', 'montr[eé]al', 'qu[eé]bec', 'calgary', 'edmonton', 'alberta',
  'winnipeg', 'halifax', 'north america', '\bnoram\b', '\bamericas\b',
]
location_include_cs = ['\bCAN\b', '\bBC\b', '\bON\b(?!-)', '\bQC\b', '\bAB\b']
country_codes = ["CA"]
country_names = ["Canada"]
# ...or is remote and names no other region. Remote roles naming another region are dropped:
location_exclude = [
  'united states', 'united kingdom', 'europe', '\bemea\b', '\bapac\b', '\basia\b', 'india', 'germany', 'france',
  'spain', 'poland', 'netherlands', 'ireland', 'japan', 'korea', 'singapore', 'australia', 'brazil', 'mexico',
  'latam', 'israel', '\buae\b', 'philippines', 'portugal', 'sweden', 'switzerland', 'taiwan', 'china',
]
location_exclude_cs = [
  '\bUSA?\b', '\bU\.S\.', '\bUK\b', '\bEU\b',
  ',\s*(AL|AK|AZ|AR|CA|CO|CT|DE|FL|GA|HI|ID|IL|IN|IA|KS|KY|LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY|DC)\b',
]
include_remote_unspecified = true   # "Remote" with no region -> alert, marked "remote, region not stated"
include_unknown_location   = true   # board gives no location -> alert, marked "location not listed"

